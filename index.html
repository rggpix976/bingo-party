<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ビンゴ抽選機" />
    <title>ビンゴ抽選機</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%20role%3D%22img%22%20aria-label%3D%22%E3%83%93%E3%83%B3%E3%82%B4%E6%8A%BD%E9%81%B8%E6%A9%9F%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2286%22%20fill%3D%22%23171717%22%20%2F%3E%0A%20%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22190%22%20fill%3D%22%23d83b2d%22%20%2F%3E%0A%20%20%3Cpath%20fill%3D%22%23b62e25%22%20d%3D%22M256%2066a190%20190%200%200%201%20190%20190H256z%22%20opacity%3D%22.85%22%20%2F%3E%0A%20%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22142%22%20fill%3D%22%23f7c948%22%20opacity%3D%22.92%22%20%2F%3E%0A%20%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%22112%22%20fill%3D%22%23f8f5ee%22%20%2F%3E%0A%20%20%3Ctext%20x%3D%22256%22%20y%3D%22298%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%22118%22%20font-weight%3D%22900%22%20fill%3D%22%23171717%22%3E75%3C%2Ftext%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml" />
    <style>
:root {
  color-scheme: light;
  --bg: #fff4bd;
  --panel: #ffffff;
  --panel-strong: #fff7e2;
  --line: rgba(39, 31, 55, 0.16);
  --text: #2b2440;
  --muted: #6b5f76;
  --gold: #f7c948;
  --red: #ef476f;
  --green: #19a96b;
  --cyan: #21a9c9;
  --purple: #7a5cff;
  --shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  min-height: 100vh;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.54), transparent 35%),
    linear-gradient(145deg, #fff5b8 0%, #ffd4e4 34%, #bfeeff 67%, #d9ffc7 100%);
}

body {
  position: relative;
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.54), transparent 35%),
    linear-gradient(145deg, #fff5b8 0%, #ffd4e4 34%, #bfeeff 67%, #d9ffc7 100%);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

body::before {
  position: fixed;
  inset: 0;
  content: "";
  background-image:
    linear-gradient(35deg, transparent 47%, rgba(239, 71, 111, 0.75) 48% 52%, transparent 53%),
    linear-gradient(125deg, transparent 47%, rgba(33, 169, 201, 0.72) 48% 52%, transparent 53%),
    linear-gradient(90deg, transparent 47%, rgba(122, 92, 255, 0.58) 48% 52%, transparent 53%),
    linear-gradient(0deg, transparent 47%, rgba(25, 169, 107, 0.58) 48% 52%, transparent 53%);
  background-position:
    1rem 0.7rem,
    3.5rem 2.5rem,
    5rem 4rem,
    7rem 1.5rem;
  background-size:
    9.5rem 6.2rem,
    10rem 6.8rem,
    8rem 7rem,
    11rem 7.5rem;
  opacity: 0.45;
  pointer-events: none;
}

.party-canvas {
  position: fixed;
  inset: 0;
  z-index: 5;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
}

.party-layer {
  position: fixed;
  inset: 0;
  z-index: 6;
  overflow: hidden;
  pointer-events: none;
}

.party-piece {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--w);
  height: var(--h);
  border-radius: 2px;
  background: var(--color);
  box-shadow: 0 0.25rem 0.55rem rgba(71, 43, 88, 0.16);
  opacity: 0;
  transform: translate3d(0, 0, 0) rotate(var(--rot)) scale(0.7);
  transform-origin: 50% 50%;
  animation: partyFly var(--dur) cubic-bezier(0.12, 0.72, 0.24, 1) var(--delay) forwards;
}

.party-piece.circle {
  border-radius: 50%;
}

.party-piece.star {
  clip-path: polygon(
    50% 0%,
    62% 34%,
    98% 35%,
    69% 56%,
    79% 91%,
    50% 70%,
    21% 91%,
    31% 56%,
    2% 35%,
    38% 34%
  );
}

.party-piece.streamer {
  width: 0.32rem;
  height: var(--h);
  border-radius: 999px;
}

.party-piece.ray {
  height: 0.28rem;
  border-radius: 999px;
  box-shadow: 0 0 0.9rem var(--color);
}

@keyframes partyFly {
  0% {
    opacity: 0;
    transform: translate3d(0, 0, 0) rotate(var(--rot)) scale(0.7);
  }

  8% {
    opacity: 1;
    transform: translate3d(calc(var(--tx) * 0.1), calc(var(--ty) * 0.1), 0) rotate(var(--rot)) scale(1);
  }

  74% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translate3d(var(--tx), var(--ty), 0) rotate(var(--end-rot)) scale(0.86);
  }
}

button {
  color: inherit;
  font: inherit;
}

.app-shell {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  min-height: 100vh;
  min-height: 100dvh;
  grid-template-rows: auto minmax(0, 1fr);
  gap: clamp(0.35rem, 1vh, 0.7rem);
  padding:
    max(0.65rem, env(safe-area-inset-top))
    max(0.9rem, env(safe-area-inset-right))
    max(0.75rem, env(safe-area-inset-bottom))
    max(0.9rem, env(safe-area-inset-left));
}

.top-bar {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 1rem;
  min-height: clamp(2.35rem, 5vh, 3.1rem);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

h1,
h2,
p {
  margin: 0;
}

h1 {
  font-size: clamp(1.2rem, 2.3vw, 2rem);
  font-weight: 900;
  letter-spacing: 0;
}

.counter {
  display: inline-grid;
  min-width: clamp(5.5rem, 9vw, 7.4rem);
  min-height: clamp(2.1rem, 4.8vh, 2.8rem);
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--text);
  font-size: clamp(0.9rem, 1.7vw, 1.15rem);
  font-weight: 800;
}

.fullscreen-button {
  display: grid;
  width: clamp(2.8rem, 5vw, 3.4rem);
  min-height: clamp(2.1rem, 4.8vh, 2.8rem);
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--text);
  box-shadow: 0 0.45rem 1rem rgba(71, 43, 88, 0.14);
  cursor: pointer;
  font-size: clamp(1.05rem, 2vw, 1.35rem);
  font-weight: 900;
  line-height: 1;
  touch-action: manipulation;
}

.fullscreen-button:active {
  transform: translateY(1px);
}

.show-floor {
  display: grid;
  min-height: 0;
  grid-template-columns: minmax(13rem, 1fr) minmax(20rem, 0.82fr) minmax(13rem, 1fr);
  gap: clamp(0.8rem, 1.7vw, 1.5rem);
  align-items: center;
}

.center-stage {
  display: grid;
  min-width: 0;
  min-height: 0;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: clamp(0.45rem, 1.2vh, 0.75rem);
  place-items: center;
}

.number-stage {
  display: grid;
  min-height: 0;
  place-items: center;
}

.drum {
  position: relative;
  display: grid;
  width: min(28vw, 62vh, 31rem);
  min-width: 16rem;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 50%;
  background:
    repeating-conic-gradient(from -6deg, #d94132 0 8deg, #a6231d 8deg 16deg),
    radial-gradient(circle, #3b1a18 0%, #180f0e 68%);
  box-shadow:
    inset 0 0 0 0.55rem rgba(255, 255, 255, 0.11),
    inset 0 0 0 1.1rem rgba(0, 0, 0, 0.28),
    var(--shadow);
  transform: translateZ(0);
}

.drum::before,
.drum::after {
  position: absolute;
  content: "";
  border-radius: 50%;
  pointer-events: none;
}

.drum::before {
  inset: 8%;
  border: clamp(0.38rem, 1vw, 0.7rem) solid rgba(248, 245, 238, 0.17);
}

.drum::after {
  inset: 18%;
  background: radial-gradient(circle at 50% 42%, #fbf8ef 0%, #ded4bd 65%, #b79345 100%);
  box-shadow:
    inset 0 0.45rem 1rem rgba(255, 255, 255, 0.4),
    inset 0 -0.65rem 1rem rgba(83, 42, 13, 0.32);
}

.drum-face {
  position: relative;
  z-index: 1;
  display: grid;
  width: 56%;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 50%;
  background: #f8f5ee;
  box-shadow: inset 0 -0.38rem 0 rgba(0, 0, 0, 0.11);
}

.number {
  color: #151515;
  font-size: clamp(5.8rem, 12vw, 9.8rem);
  font-weight: 950;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}

.status {
  position: absolute;
  z-index: 2;
  bottom: 12%;
  display: grid;
  min-width: clamp(6.8rem, 10vw, 8.8rem);
  min-height: clamp(1.8rem, 3.6vh, 2.3rem);
  place-items: center;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.64);
  color: var(--gold);
  font-size: clamp(0.72rem, 1.2vw, 0.9rem);
  font-weight: 900;
  letter-spacing: 0.12rem;
}

.photo-slot {
  position: relative;
  display: grid;
  align-self: center;
  width: min(100%, 32rem);
  height: min(55vh, 27vw);
  min-height: 13rem;
  min-width: 0;
  place-items: center;
  overflow: visible;
  border: clamp(0.32rem, 0.8vw, 0.58rem) solid #ffffff;
  border-radius: 8px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.2)),
    #ffe5ef;
  box-shadow: 0 1rem 2.2rem rgba(71, 43, 88, 0.2);
  cursor: pointer;
  touch-action: manipulation;
}

.photo-slot::after {
  position: absolute;
  inset: 0;
  content: "";
  border: 1px solid rgba(0, 0, 0, 0.18);
  pointer-events: none;
}

.photo-slot:active {
  transform: scale(0.99);
}

.photo-left {
  justify-self: end;
  rotate: -1.4deg;
}

.photo-right {
  justify-self: start;
  rotate: 1.4deg;
}

.photo-image {
  width: 100%;
  height: 100%;
  display: none;
  border-radius: 3px;
  object-fit: cover;
}

.photo-slot.has-photo .photo-image {
  display: block;
}

.photo-placeholder {
  display: grid;
  width: clamp(2.2rem, 4vw, 3.5rem);
  aspect-ratio: 1;
  place-items: center;
  border: 2px dashed rgba(43, 36, 64, 0.35);
  border-radius: 50%;
  color: rgba(43, 36, 64, 0.7);
  font-size: clamp(1.4rem, 3vw, 2.3rem);
  font-weight: 600;
  line-height: 1;
}

.photo-slot.has-photo .photo-placeholder {
  display: none;
}

.speech-bubble {
  position: absolute;
  z-index: 3;
  top: clamp(-1.2rem, -2.4vw, -0.6rem);
  display: grid;
  min-width: clamp(6.4rem, 12vw, 9.6rem);
  min-height: clamp(3rem, 6vw, 4.3rem);
  place-items: center;
  border: clamp(0.16rem, 0.35vw, 0.25rem) solid #2b2440;
  border-radius: 999px;
  background: #ffffff;
  color: #2b2440;
  box-shadow:
    0 0.65rem 1.2rem rgba(71, 43, 88, 0.2),
    inset 0 -0.25rem 0 rgba(247, 201, 72, 0.34);
  font-size: clamp(1.2rem, 2.45vw, 2rem);
  font-weight: 950;
  line-height: 1;
  opacity: 0;
  pointer-events: none;
  text-shadow: 0 0.08rem 0 rgba(247, 201, 72, 0.45);
  transform: translateY(0.25rem) scale(0.78);
  transform-origin: 50% 85%;
  transition:
    opacity 0.22s ease,
    transform 0.22s ease,
    visibility 0s linear 0.22s;
  visibility: hidden;
}

.speech-bubble::after {
  position: absolute;
  bottom: -0.72rem;
  width: 1.15rem;
  height: 1.15rem;
  content: "";
  border-right: clamp(0.16rem, 0.35vw, 0.25rem) solid #2b2440;
  border-bottom: clamp(0.16rem, 0.35vw, 0.25rem) solid #2b2440;
  background: #ffffff;
  transform: rotate(45deg);
}

.photo-left .speech-bubble {
  right: clamp(0.4rem, 1.3vw, 1.2rem);
}

.photo-left .speech-bubble::after {
  right: 2rem;
}

.photo-right .speech-bubble {
  left: clamp(0.4rem, 1.3vw, 1.2rem);
}

.photo-right .speech-bubble::after {
  left: 2rem;
}

.drum.is-rolling {
  animation: drumShake 0.11s linear infinite;
}

.drum.is-hit {
  animation: drumHit 0.36s cubic-bezier(0.16, 1, 0.3, 1);
}

.number.is-flash {
  animation: numberPop 0.38s cubic-bezier(0.2, 1.5, 0.36, 1);
}

.controls {
  display: grid;
  width: min(100%, 23rem);
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(0.45rem, 1vw, 0.75rem);
}

.control-button,
.icon-button {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  box-shadow: 0 0.6rem 1.3rem rgba(71, 43, 88, 0.2);
  cursor: pointer;
  touch-action: manipulation;
}

.control-button {
  display: grid;
  min-width: 0;
  min-height: clamp(3.5rem, 9vh, 4.7rem);
  grid-template-rows: auto auto;
  place-items: center;
  gap: 0.1rem;
  padding: 0.5rem 0.4rem;
  font-weight: 900;
}

.control-button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.control-button:active:not(:disabled) {
  transform: translateY(1px);
}

.control-button.primary {
  border-color: rgba(47, 184, 117, 0.46);
  background: linear-gradient(180deg, #31b978 0%, #188050 100%);
}

.control-button.primary.is-stop {
  border-color: rgba(216, 59, 45, 0.58);
  background: linear-gradient(180deg, #e04b3b 0%, #a92820 100%);
}

.control-button.danger {
  border-color: rgba(216, 59, 45, 0.42);
  background: linear-gradient(180deg, #fff 0%, #ffe2e9 100%);
  color: #8a1e34;
}

.button-icon {
  display: grid;
  width: 1.5rem;
  height: 1.5rem;
  place-items: center;
  font-size: clamp(1rem, 2vw, 1.25rem);
  line-height: 1;
}

.button-text {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  font-size: clamp(0.82rem, 1.6vw, 1.05rem);
  letter-spacing: 0;
}

.dialog {
  width: min(calc(100vw - 2rem), 36rem);
  max-height: min(82svh, 44rem);
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
  color: var(--text);
  box-shadow: var(--shadow);
}

.dialog::backdrop {
  background: rgba(0, 0, 0, 0.62);
  backdrop-filter: blur(3px);
}

.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.dialog h2 {
  font-size: 1.18rem;
  font-weight: 800;
  letter-spacing: 0;
}

.icon-button {
  display: grid;
  width: 2.6rem;
  height: 2.6rem;
  flex: none;
  place-items: center;
  background: var(--panel-strong);
  font-size: 1.35rem;
  line-height: 1;
}

.number-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(3.3rem, 1fr));
  gap: 0.5rem;
  max-height: calc(82svh - 7rem);
  overflow: auto;
  padding-right: 0.15rem;
}

.drawn-number,
.empty-state {
  display: grid;
  min-height: 3.2rem;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 6px;
}

.drawn-number {
  background: #f8f5ee;
  color: #171717;
  font-size: 1.25rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.drawn-number.latest {
  border-color: var(--gold);
  background: var(--gold);
}

.empty-state {
  grid-column: 1 / -1;
  color: var(--muted);
}

.dialog-copy {
  color: var(--muted);
  line-height: 1.7;
}

.dialog-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
  margin-top: 1rem;
}

.dialog-actions .control-button {
  min-height: 3.5rem;
}

@keyframes drumShake {
  0% {
    transform: translate3d(-1px, 0, 0) rotate(-0.5deg);
  }

  50% {
    transform: translate3d(1px, 1px, 0) rotate(0.5deg);
  }

  100% {
    transform: translate3d(0, -1px, 0) rotate(0deg);
  }
}

@keyframes drumHit {
  0% {
    transform: scale(1);
  }

  42% {
    transform: scale(1.055);
  }

  100% {
    transform: scale(1);
  }
}

@keyframes numberPop {
  0% {
    transform: scale(0.82);
  }

  55% {
    transform: scale(1.13);
  }

  100% {
    transform: scale(1);
  }
}

body.speak-left .photo-left .speech-bubble,
body.speak-right .photo-right .speech-bubble {
  opacity: 1;
  transform: translateY(-0.22rem) scale(1.08);
  transition-delay: 0s;
  visibility: visible;
}

body.speak-left .photo-left .speech-bubble {
  animation: speechPopLeft 0.62s ease-in-out infinite alternate;
}

body.speak-right .photo-right .speech-bubble {
  animation: speechPopRight 0.62s ease-in-out infinite alternate;
}

@keyframes speechPopLeft {
  from {
    transform: translateY(-0.14rem) scale(1.03) rotate(-1deg);
  }

  to {
    transform: translateY(-0.3rem) scale(1.12) rotate(1deg);
  }
}

@keyframes speechPopRight {
  from {
    transform: translateY(-0.14rem) scale(1.03) rotate(1deg);
  }

  to {
    transform: translateY(-0.3rem) scale(1.12) rotate(-1deg);
  }
}

@media (max-width: 820px), (orientation: portrait) {
  body {
    overflow: hidden;
  }

  .app-shell {
    min-height: 100vh;
    min-height: 100dvh;
  }

  .show-floor {
    grid-template-columns: minmax(0, 1fr) minmax(12rem, 1.2fr) minmax(0, 1fr);
    gap: 0.45rem;
  }

  .drum {
    width: min(36vw, 54vh, 22rem);
    min-width: 11rem;
  }

  .photo-slot {
    height: min(40vh, 30vw);
    min-height: 8.5rem;
  }

  .controls {
    width: min(100%, 19rem);
  }
}

@media (max-height: 500px) and (orientation: landscape) {
  .top-bar {
    min-height: 2.2rem;
  }

  .drum {
    width: min(27vw, 58vh, 22rem);
    min-width: 14rem;
  }

  .control-button {
    min-height: 3.1rem;
  }

  .photo-slot {
    height: min(51vh, 25vw);
    min-height: 10.5rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }

  .party-piece {
    animation-duration: var(--dur) !important;
    animation-iteration-count: 1 !important;
  }

  body.speak-left .photo-left .speech-bubble,
  body.speak-right .photo-right .speech-bubble {
    animation-duration: 0.62s !important;
    animation-iteration-count: infinite !important;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="top-bar">
        <h1 id="app-title">ビンゴ抽選機</h1>
        <div class="top-actions">
          <output class="counter" id="counter" aria-live="polite">0 / 75</output>
          <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="全画面にする" title="全画面">
            <span aria-hidden="true">⛶</span>
          </button>
        </div>
      </header>

      <section class="show-floor" aria-label="ビンゴステージ">

          <span class="photo-placeholder" aria-hidden="true">+</span>
          <span class="speech-bubble" aria-hidden="true">ビンゴ！</span>

        </button>
      </section>

      <input id="photoInput" type="file" accept="image/*" hidden />

class SoundEngine {
  constructor() {
    this.context = null;
    this.rollGain = null;
    this.rollSource = null;
    this.tickTimer = 0;
    this.rollRequestId = 0;
    this.rollBuffer = null;
    this.rollBufferPromise = null;
    this.rollLoopSources = [];
    this.rollLoopTimers = [];
    this.rollMasterGain = null;
    this.isRollingSound = false;
    this.rollAudio = this.createAudio(ROLL_AUDIO_SRC, true);
    this.hitAudio = this.createAudio(HIT_AUDIO_SRC, false);
  }

  createAudio(src, loop) {
    const audio = new Audio(src);
    audio.loop = loop;
    audio.preload = "auto";
    audio.playsInline = true;
    audio.load();
    return audio;
  }

  ensureContext() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;

    if (!AudioContext) {
      return null;
    }

    if (!this.context) {
      this.context = new AudioContext();
    }

    if (this.context.state === "suspended") {
      this.context.resume();
    }

    return this.context;
  }

  loadRollBuffer() {
    if (this.rollBuffer) {
      return Promise.resolve(this.rollBuffer);
    }

    if (this.rollBufferPromise) {
      return this.rollBufferPromise;
    }

    const context = this.ensureContext();

    if (!context || !window.fetch) {
      return Promise.resolve(null);
    }

    this.rollBufferPromise = fetch(ROLL_AUDIO_SRC)
      .then((response) => {
        if (!response.ok) {
          throw new Error("drumroll load failed");
        }

        return response.arrayBuffer();
      })
      .then((arrayBuffer) => context.decodeAudioData(arrayBuffer))
      .then((buffer) => {
        this.rollBuffer = buffer;
        return buffer;
      })
      .catch(() => null);

    return this.rollBufferPromise;
  }

  startRoll() {
    this.stopRoll();

    const requestId = ++this.rollRequestId;
    this.isRollingSound = true;

    this.loadRollBuffer().then((buffer) => {
      if (!this.isRollingSound || requestId !== this.rollRequestId) {
        return;
      }

      if (buffer) {
        this.startBufferedRoll(buffer);
        return;
      }

      this.startAudioElementRoll(requestId);
    });
  }

  startAudioElementRoll(requestId) {
    if (!this.isRollingSound || requestId !== this.rollRequestId) {
      return;
    }

    if (this.rollAudio) {
      this.rollAudio.pause();
      this.rollAudio.currentTime = 0;
      this.rollAudio.volume = 0.92;

      const playPromise = this.rollAudio.play();

      if (playPromise?.catch) {
        playPromise.catch(() => {
          if (this.rollRequestId === requestId) {
            this.startSyntheticRoll();
          }
        });
      }

      return;
    }

    this.startSyntheticRoll();
  }

  startBufferedRoll(buffer) {
    const context = this.ensureContext();

    if (!context) {
      this.startAudioElementRoll(this.rollRequestId);
      return;
    }

    const overlap = Math.min(0.22, Math.max(0.08, buffer.duration * 0.12));
    const period = Math.max(0.12, buffer.duration - overlap);
    const firstStart = context.currentTime + 0.025;
    const masterGain = context.createGain();

    masterGain.gain.setValueAtTime(0.0001, context.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.92, context.currentTime + 0.08);
    masterGain.connect(context.destination);
    this.rollMasterGain = masterGain;

    const scheduleSource = (startTime) => {
      if (!this.isRollingSound || this.rollMasterGain !== masterGain) {
        return;
      }

      const source = context.createBufferSource();
      const gain = context.createGain();

      source.buffer = buffer;
      source.connect(gain);
      gain.connect(masterGain);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(1, startTime + 0.045);
      gain.gain.setValueAtTime(1, startTime + buffer.duration - overlap);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + buffer.duration);
      source.start(startTime);
      source.stop(startTime + buffer.duration + 0.04);

      this.rollLoopSources.push(source);
      source.addEventListener("ended", () => {
        this.rollLoopSources = this.rollLoopSources.filter((item) => item !== source);
      });
    };

    const scheduleLoop = (startTime) => {
      scheduleSource(startTime);

      const nextStart = startTime + period;
      const delay = Math.max(0, (nextStart - context.currentTime - 0.08) * 1000);
      const timer = window.setTimeout(() => {
        this.rollLoopTimers = this.rollLoopTimers.filter((item) => item !== timer);

        if (this.isRollingSound && this.rollMasterGain === masterGain) {
          scheduleLoop(nextStart);
        }
      }, delay);

      this.rollLoopTimers.push(timer);
    };

    scheduleLoop(firstStart);
  }

  startSyntheticRoll() {
    const context = this.ensureContext();

    if (!context) {
      return;
    }

    const bufferSize = context.sampleRate * 2;
    const noiseBuffer = context.createBuffer(1, bufferSize, context.sampleRate);
    const channel = noiseBuffer.getChannelData(0);

    for (let index = 0; index < bufferSize; index += 1) {
      channel[index] = Math.random() * 2 - 1;
    }

    const source = context.createBufferSource();
    const filter = context.createBiquadFilter();
    const gain = context.createGain();

    source.buffer = noiseBuffer;
    source.loop = true;
    filter.type = "bandpass";
    filter.frequency.value = 320;
    filter.Q.value = 0.8;
    gain.gain.setValueAtTime(0.0001, context.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, context.currentTime + 0.18);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(context.destination);
    source.start();

    this.rollSource = source;
    this.rollGain = gain;
    this.tickTimer = window.setInterval(() => this.playTick(), 82);
  }

  stopRoll() {
    this.rollRequestId += 1;
    this.isRollingSound = false;

    if (this.rollAudio) {
      this.rollAudio.pause();
      this.rollAudio.currentTime = 0;
    }

    this.rollLoopTimers.forEach((timer) => window.clearTimeout(timer));
    this.rollLoopTimers = [];

    if (this.rollMasterGain && this.context) {
      const masterGain = this.rollMasterGain;
      const now = this.context.currentTime;

      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(0.0001, now);
      window.setTimeout(() => {
        try {
          masterGain.disconnect();
        } catch {
          // The node may already have been disconnected after a quick restart.
        }
      }, 240);
    }

    this.rollLoopSources.forEach((source) => {
      try {
        source.stop();
      } catch {
        // A scheduled loop source may already have stopped naturally.
      }
    });
    this.rollLoopSources = [];
    this.rollMasterGain = null;

    if (this.tickTimer) {
      window.clearInterval(this.tickTimer);
      this.tickTimer = 0;
    }

    if (this.rollGain && this.context) {
      const now = this.context.currentTime;
      this.rollGain.gain.cancelScheduledValues(now);
      this.rollGain.gain.setTargetAtTime(0.0001, now, 0.05);
    }

    if (this.rollSource) {
      window.setTimeout(() => {
        try {
          this.rollSource.stop();
        } catch {
          // The source may already have ended on slower mobile devices.
        }
      }, 120);
      this.rollSource = null;
      this.rollGain = null;
    }
  }

  playTick() {
    const context = this.context;

    if (!context) {
      return;
    }

    const now = context.currentTime;
    const oscillator = context.createOscillator();
    const gain = context.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(236 + Math.random() * 76, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.09, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);

    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.05);
  }

  playHit() {
    if (this.hitAudio) {
      this.hitAudio.pause();
      this.hitAudio.currentTime = 0;
      this.hitAudio.volume = 1;

      const playPromise = this.hitAudio.play();

      if (playPromise?.catch) {
        playPromise.catch(() => this.playSyntheticHit());
      }

      return;
    }

    this.playSyntheticHit();
  }

  playSyntheticHit() {
    const context = this.ensureContext();

    if (!context) {
      return;
    }

    const now = context.currentTime;
    const output = context.createGain();
    const kick = context.createOscillator();
    const kickGain = context.createGain();
    const click = context.createOscillator();
    const clickGain = context.createGain();
    const punch = context.createBufferSource();
    const punchGain = context.createGain();
    const punchFilter = context.createBiquadFilter();
    const crash = context.createBufferSource();
    const crashGain = context.createGain();
    const crashFilter = context.createBiquadFilter();
    const punchBuffer = context.createBuffer(1, Math.ceil(context.sampleRate * 0.16), context.sampleRate);
    const crashBuffer = context.createBuffer(1, Math.ceil(context.sampleRate * 0.62), context.sampleRate);
    const punchData = punchBuffer.getChannelData(0);
    const crashData = crashBuffer.getChannelData(0);

    output.gain.setValueAtTime(0.82, now);
    output.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
    output.connect(context.destination);

    for (let index = 0; index < punchData.length; index += 1) {
      const fade = 1 - index / punchData.length;
      punchData[index] = (Math.random() * 2 - 1) * fade * fade;
    }

    for (let index = 0; index < crashData.length; index += 1) {
      const fade = 1 - index / crashData.length;
      crashData[index] = (Math.random() * 2 - 1) * fade;
    }

    kick.type = "sine";
    kick.frequency.setValueAtTime(190, now);
    kick.frequency.exponentialRampToValueAtTime(44, now + 0.22);
    kickGain.gain.setValueAtTime(0.0001, now);
    kickGain.gain.exponentialRampToValueAtTime(1, now + 0.012);
    kickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

    click.type = "square";
    click.frequency.setValueAtTime(2100, now);
    click.frequency.exponentialRampToValueAtTime(720, now + 0.045);
    clickGain.gain.setValueAtTime(0.0001, now);
    clickGain.gain.exponentialRampToValueAtTime(0.2, now + 0.006);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);

    punch.buffer = punchBuffer;
    punchFilter.type = "bandpass";
    punchFilter.frequency.setValueAtTime(620, now);
    punchFilter.Q.value = 0.9;
    punchGain.gain.setValueAtTime(0.36, now);
    punchGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

    crash.buffer = crashBuffer;
    crashFilter.type = "highpass";
    crashFilter.frequency.setValueAtTime(2300, now);
    crashGain.gain.setValueAtTime(0.0001, now);
    crashGain.gain.exponentialRampToValueAtTime(0.18, now + 0.025);
    crashGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);

    kick.connect(kickGain);
    kickGain.connect(output);
    click.connect(clickGain);
    clickGain.connect(output);
    punch.connect(punchFilter);
    punchFilter.connect(punchGain);
    punchGain.connect(output);
    crash.connect(crashFilter);
    crashFilter.connect(crashGain);
    crashGain.connect(output);

    kick.start(now);
    kick.stop(now + 0.42);
    click.start(now);
    click.stop(now + 0.08);
    punch.start(now);
    punch.stop(now + 0.18);
    crash.start(now + 0.01);
    crash.stop(now + 0.74);

    [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
      const start = now + 0.08 + index * 0.045;
      const end = start + 0.52;
      const note = context.createOscillator();
      const noteGain = context.createGain();

      note.type = index === 3 ? "sine" : "triangle";
      note.frequency.setValueAtTime(frequency, start);
      note.frequency.exponentialRampToValueAtTime(frequency * 1.012, end);
      noteGain.gain.setValueAtTime(0.0001, start);
      noteGain.gain.exponentialRampToValueAtTime(0.13 - index * 0.012, start + 0.018);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, end);

      note.connect(noteGain);
      noteGain.connect(output);
      note.start(start);
      note.stop(end + 0.02);
    });
  }
}

const sound = new SoundEngine();

class PartyEffects {
  constructor() {
    this.canvas = null;
    this.context = null;
    this.particles = [];
    this.animationFrame = 0;
    this.lastTime = 0;
    this.colors = ["#ef476f", "#ffd166", "#06d6a0", "#118ab2", "#7a5cff", "#ff8fab", "#ffffff"];
    this.resize = this.resize.bind(this);
  }

  ensureCanvas() {
    if (this.canvas) {
      return true;
    }

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    if (!context) {
      return false;
    }

    canvas.className = "party-canvas";
    canvas.setAttribute("aria-hidden", "true");
    document.body.append(canvas);
    this.canvas = canvas;
    this.context = context;
    window.addEventListener("resize", this.resize);
    this.resize();
    return true;
  }

  resize() {
    if (!this.canvas || !this.context) {
      return;
    }

    const scale = Math.min(window.devicePixelRatio || 1, 2);

    this.width = window.innerWidth;
    this.height = window.innerHeight;
    this.canvas.width = Math.round(this.width * scale);
    this.canvas.height = Math.round(this.height * scale);
    this.canvas.style.width = `${this.width}px`;
    this.canvas.style.height = `${this.height}px`;
    this.context.setTransform(scale, 0, 0, scale, 0, 0);
  }

  celebrate() {
    if (!this.ensureCanvas()) {
      return;
    }

    const mode = Math.floor(Math.random() * 3);
    const centerX = this.width / 2;
    const centerY = this.height * 0.43;

    if (mode === 0) {
      this.addConfettiRain();
      this.addBurst(centerX, centerY, 42);
    } else if (mode === 1) {
      this.addCrackerBurst(this.width * 0.18, this.height * 0.55, 1);
      this.addCrackerBurst(this.width * 0.82, this.height * 0.55, -1);
    } else {
      this.addBurst(centerX, centerY, 82);
      this.addStreamerRain();
    }

    this.start();
  }

  addConfettiRain() {
    for (let index = 0; index < 90; index += 1) {
      this.particles.push(this.createParticle({
        x: Math.random() * this.width,
        y: -20 - Math.random() * this.height * 0.35,
        vx: -70 + Math.random() * 140,
        vy: 210 + Math.random() * 230,
        gravity: 220,
        life: 2.9 + Math.random() * 1.3,
        shape: Math.random() > 0.35 ? "rect" : "circle",
      }));
    }
  }

  addStreamerRain() {
    for (let index = 0; index < 44; index += 1) {
      this.particles.push(this.createParticle({
        x: Math.random() * this.width,
        y: -30 - Math.random() * this.height * 0.25,
        vx: -40 + Math.random() * 80,
        vy: 180 + Math.random() * 180,
        gravity: 140,
        life: 3.1 + Math.random() * 1,
        shape: "streamer",
      }));
    }
  }

  addBurst(x, y, count) {
    for (let index = 0; index < count; index += 1) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 190 + Math.random() * 520;

      this.particles.push(this.createParticle({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 80,
        gravity: 360,
        life: 1.1 + Math.random() * 1.2,
        shape: Math.random() > 0.22 ? "rect" : "star",
      }));
    }
  }

  addCrackerBurst(x, y, direction) {
    for (let index = 0; index < 54; index += 1) {
      const angle = (-0.68 + Math.random() * 1.36) + (direction > 0 ? 0 : Math.PI);
      const speed = 270 + Math.random() * 520;

      this.particles.push(this.createParticle({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 160,
        gravity: 330,
        life: 1.25 + Math.random() * 1.15,
        shape: Math.random() > 0.28 ? "rect" : "spark",
      }));
    }

    for (let index = 0; index < 12; index += 1) {
      const angle = (-0.48 + Math.random() * 0.96) + (direction > 0 ? 0 : Math.PI);

      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * 340,
        vy: Math.sin(angle) * 340 - 120,
        size: 2,
        length: 80 + Math.random() * 64,
        rotation: angle,
        rotationSpeed: 0,
        gravity: 0,
        age: 0,
        life: 0.42 + Math.random() * 0.18,
        color: this.pickColor(),
        shape: "ray",
      });
    }
  }

  createParticle(options) {
    return {
      x: options.x,
      y: options.y,
      vx: options.vx,
      vy: options.vy,
      size: 6 + Math.random() * 10,
      length: 16 + Math.random() * 24,
      rotation: Math.random() * Math.PI,
      rotationSpeed: -8 + Math.random() * 16,
      gravity: options.gravity,
      age: 0,
      life: options.life,
      color: this.pickColor(),
      shape: options.shape,
    };
  }

  pickColor() {
    return this.colors[Math.floor(Math.random() * this.colors.length)];
  }

  start() {
    if (this.animationFrame) {
      return;
    }

    this.lastTime = performance.now();
    this.animationFrame = requestAnimationFrame((time) => this.tick(time));
  }

  tick(time) {
    const delta = Math.min((time - this.lastTime) / 1000, 0.033);
    this.lastTime = time;
    this.context.clearRect(0, 0, this.width, this.height);
    this.particles = this.particles.filter((particle) => this.updateParticle(particle, delta));

    if (this.particles.length > 0) {
      this.animationFrame = requestAnimationFrame((nextTime) => this.tick(nextTime));
      return;
    }

    this.animationFrame = 0;
    this.context.clearRect(0, 0, this.width, this.height);
  }

  updateParticle(particle, delta) {
    particle.age += delta;

    if (particle.age >= particle.life) {
      return false;
    }

    particle.vy += particle.gravity * delta;
    particle.x += particle.vx * delta;
    particle.y += particle.vy * delta;
    particle.rotation += particle.rotationSpeed * delta;
    this.drawParticle(particle);
    return true;
  }

  drawParticle(particle) {
    const alpha = Math.max(0, 1 - particle.age / particle.life);
    const context = this.context;

    context.save();
    context.globalAlpha = alpha;
    context.translate(particle.x, particle.y);
    context.rotate(particle.rotation);
    context.fillStyle = particle.color;
    context.strokeStyle = particle.color;
    context.lineCap = "round";

    if (particle.shape === "circle") {
      context.beginPath();
      context.arc(0, 0, particle.size * 0.46, 0, Math.PI * 2);
      context.fill();
    } else if (particle.shape === "star") {
      this.drawStar(context, particle.size * 0.8);
    } else if (particle.shape === "spark") {
      context.lineWidth = 3;
      context.beginPath();
      context.moveTo(-particle.length * 0.5, 0);
      context.lineTo(particle.length * 0.5, 0);
      context.stroke();
    } else if (particle.shape === "ray") {
      context.globalAlpha = alpha * 0.74;
      context.lineWidth = 5;
      context.beginPath();
      context.moveTo(0, 0);
      context.lineTo(particle.length, 0);
      context.stroke();
    } else if (particle.shape === "streamer") {
      context.lineWidth = 4;
      context.beginPath();
      for (let step = 0; step < 5; step += 1) {
        const x = -particle.length / 2 + step * (particle.length / 4);
        const y = Math.sin(step * Math.PI * 0.9 + particle.age * 8) * particle.size * 0.32;

        if (step === 0) {
          context.moveTo(x, y);
        } else {
          context.lineTo(x, y);
        }
      }
      context.stroke();
    } else {
      context.fillRect(-particle.size * 0.5, -particle.size * 0.28, particle.size, particle.size * 0.56);
    }

    context.restore();
  }

  drawStar(context, radius) {
    context.beginPath();
    for (let point = 0; point < 10; point += 1) {
      const angle = -Math.PI / 2 + point * (Math.PI / 5);
      const length = point % 2 === 0 ? radius : radius * 0.48;
      const x = Math.cos(angle) * length;
      const y = Math.sin(angle) * length;

      if (point === 0) {
        context.moveTo(x, y);
      } else {
        context.lineTo(x, y);
      }
    }
    context.closePath();
    context.fill();
  }
}

class DomPartyEffects {
  constructor() {
    this.colors = ["#ef476f", "#ffd166", "#06d6a0", "#118ab2", "#7a5cff", "#ff8fab", "#ffffff"];
  }

  celebrate() {
    const layer = document.createElement("div");
    const mode = Math.floor(Math.random() * 3);

    layer.className = "party-layer";
    layer.setAttribute("aria-hidden", "true");
    document.body.append(layer);

    if (mode === 0) {
      this.addRain(layer, 86);
      this.addBurst(layer, 50, 45, 30);
    } else if (mode === 1) {
      this.addCracker(layer, 17, 58, 1);
      this.addCracker(layer, 83, 58, -1);
    } else {
      this.addBurst(layer, 50, 45, 76);
      this.addRain(layer, 38, true);
    }

    window.setTimeout(() => layer.remove(), 3600);
  }

  addRain(layer, count, streamers = false) {
    for (let index = 0; index < count; index += 1) {
      const shape = streamers ? "streamer" : this.randomShape();
      const x = Math.random() * 100;
      const y = -8 - Math.random() * 34;
      const tx = -8 + Math.random() * 16;
      const ty = 82 + Math.random() * 42;

      this.addPiece(layer, {
        x,
        y,
        tx,
        ty,
        shape,
        size: 8 + Math.random() * 10,
        duration: 2.4 + Math.random() * 1.1,
        delay: Math.random() * 0.4,
      });
    }
  }

  addBurst(layer, x, y, count) {
    for (let index = 0; index < count; index += 1) {
      const angle = Math.random() * Math.PI * 2;
      const distance = 24 + Math.random() * 48;

      this.addPiece(layer, {
        x,
        y,
        tx: Math.cos(angle) * distance,
        ty: Math.sin(angle) * distance + 18,
        shape: Math.random() > 0.22 ? "rect" : "star",
        size: 7 + Math.random() * 11,
        duration: 1.25 + Math.random() * 0.95,
        delay: Math.random() * 0.1,
      });
    }
  }

  addCracker(layer, x, y, direction) {
    for (let index = 0; index < 58; index += 1) {
      const angle = (-0.72 + Math.random() * 1.44) + (direction > 0 ? 0 : Math.PI);
      const distance = 30 + Math.random() * 50;

      this.addPiece(layer, {
        x,
        y,
        tx: Math.cos(angle) * distance,
        ty: Math.sin(angle) * distance - 24 + Math.random() * 28,
        shape: Math.random() > 0.28 ? "rect" : "circle",
        size: 7 + Math.random() * 12,
        duration: 1.25 + Math.random() * 0.85,
        delay: Math.random() * 0.08,
      });
    }

    for (let index = 0; index < 14; index += 1) {
      const angle = (-0.52 + Math.random() * 1.04) + (direction > 0 ? 0 : Math.PI);
      const distance = 23 + Math.random() * 22;

      this.addPiece(layer, {
        x,
        y,
        tx: Math.cos(angle) * distance,
        ty: Math.sin(angle) * distance - 10,
        shape: "ray",
        size: 34 + Math.random() * 34,
        duration: 0.62 + Math.random() * 0.2,
        delay: Math.random() * 0.04,
      });
    }
  }

  addPiece(layer, options) {
    const piece = document.createElement("span");
    const size = options.size;
    const isRay = options.shape === "ray";
    const isStreamer = options.shape === "streamer";

    piece.className = `party-piece ${options.shape}`;
    piece.style.setProperty("--x", `${options.x}vw`);
    piece.style.setProperty("--y", `${options.y}vh`);
    piece.style.setProperty("--tx", `${options.tx}vw`);
    piece.style.setProperty("--ty", `${options.ty}vh`);
    piece.style.setProperty("--w", `${isRay ? size : Math.max(5, size * 0.72)}px`);
    piece.style.setProperty("--h", `${isStreamer ? size * 3.4 : isRay ? 4 : size}px`);
    piece.style.setProperty("--color", this.pickColor());
    piece.style.setProperty("--rot", `${Math.random() * 360}deg`);
    piece.style.setProperty("--end-rot", `${360 + Math.random() * 720}deg`);
    piece.style.setProperty("--dur", `${options.duration}s`);
    piece.style.setProperty("--delay", `${options.delay}s`);
    layer.append(piece);
  }

  randomShape() {
    const value = Math.random();

    if (value > 0.78) {
      return "circle";
    }

    if (value > 0.6) {
      return "star";
    }

    return "rect";
  }

  pickColor() {
    return this.colors[Math.floor(Math.random() * this.colors.length)];
  }
}

const domPartyEffects = new DomPartyEffects();

function createPool() {
  return Array.from({ length: TOTAL_NUMBERS }, (_, index) => index + 1);
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if (!saved || !Array.isArray(saved.drawn)) {
      return;
    }

    const validDrawn = saved.drawn
      .map((value) => Number(value))
      .filter((value, index, list) => value >= 1 && value <= TOTAL_NUMBERS && list.indexOf(value) === index);

    state.drawn = validDrawn;
    state.pool = createPool().filter((value) => !validDrawn.includes(value));
    state.currentNumber = validDrawn.at(-1) ?? null;
  } catch {
    localStorage.removeItem(STORAGE_KEY);
  }
}

function loadPhotos() {
  try {
    const saved = JSON.parse(localStorage.getItem(PHOTO_STORAGE_KEY));

    if (Array.isArray(saved)) {
      state.photos = Array.from({ length: PHOTO_SLOT_COUNT }, (_, index) => saved[index] || null);
    }
  } catch {
    localStorage.removeItem(PHOTO_STORAGE_KEY);
  }
}

function saveState() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      drawn: state.drawn,
    }),
  );
}

function savePhotos() {
  try {
    localStorage.setItem(PHOTO_STORAGE_KEY, JSON.stringify(state.photos));
  } catch {
    window.alert("写真が大きすぎるため保存できませんでした。別の写真を選んでください。");
  }
}

function updateView() {
  elements.number.textContent = state.currentNumber ?? "--";
  elements.counter.textContent = `${state.drawn.length} / ${TOTAL_NUMBERS}`;
  elements.startButton.disabled = state.pool.length === 0 && !state.rolling;

  if (state.rolling) {
    elements.status.textContent = "ROLLING";
    elements.startButton.classList.add("is-stop");
    elements.startButton.querySelector(".button-icon").textContent = "■";
    elements.startButton.querySelector(".button-text").textContent = "ストップ";
    elements.drum.classList.add("is-rolling");
    return;
  }

  elements.startButton.classList.remove("is-stop");
  elements.startButton.querySelector(".button-icon").textContent = "▶";
  elements.startButton.querySelector(".button-text").textContent = "スタート";
  elements.drum.classList.remove("is-rolling");
  elements.status.textContent = state.pool.length === 0 ? "FINISH" : "READY";
}

function renderPhotos() {
  elements.photoSlots.forEach((slot) => {
    const index = Number(slot.dataset.photoSlot);
    const image = slot.querySelector(".photo-image");
    const photo = state.photos[index];

    slot.classList.toggle("has-photo", Boolean(photo));

    if (photo) {
      image.src = photo;
      slot.setAttribute("aria-label", `${index === 0 ? "左" : "右"}の写真を変更`);
    } else {
      image.removeAttribute("src");
      slot.setAttribute("aria-label", `${index === 0 ? "左" : "右"}の写真を選ぶ`);
    }
  });
}

function randomPoolNumber() {
  return state.pool[Math.floor(Math.random() * state.pool.length)];
}

function startRoll() {
  if (state.pool.length === 0) {
    return;
  }

  state.rolling = true;
  state.currentNumber = randomPoolNumber();
  updateView();
  sound.startRoll();

  state.rollTimer = window.setInterval(() => {
    state.currentNumber = randomPoolNumber();
    elements.number.textContent = state.currentNumber;
  }, 58);
}

function stopRoll() {
  window.clearInterval(state.rollTimer);
  state.rollTimer = 0;
  state.rolling = false;
  sound.stopRoll();

  const selected = state.currentNumber ?? randomPoolNumber();
  state.currentNumber = selected;
  state.pool = state.pool.filter((value) => value !== selected);
  state.drawn.push(selected);
  saveState();
  updateView();
  flashResult();
  try {
    domPartyEffects.celebrate();
  } catch {
    // The bingo result and sound should still happen even if the visual effect fails.
  }
  sound.playHit();
}

function flashResult() {
  elements.drum.classList.remove("is-hit");
  elements.number.classList.remove("is-flash");

  requestAnimationFrame(() => {
    elements.drum.classList.add("is-hit");
    elements.number.classList.add("is-flash");
  });
}

function resetGame() {
  window.clearInterval(state.rollTimer);
  state.rollTimer = 0;
  state.pool = createPool();
  state.drawn = [];
  state.currentNumber = null;
  state.rolling = false;
  localStorage.removeItem(STORAGE_KEY);
  sound.stopRoll();
  updateView();
  renderList();
}

function renderList() {
  elements.numberList.replaceChildren();

  if (state.drawn.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty-state";
    empty.textContent = "まだ出ていません";
    elements.numberList.append(empty);
    return;
  }

  [...state.drawn].reverse().forEach((value, index) => {
    const item = document.createElement("div");
    item.className = `drawn-number${index === 0 ? " latest" : ""}`;
    item.textContent = value;
    elements.numberList.append(item);
  });
}

function openDialog(dialog) {
  if (typeof dialog.showModal === "function") {
    dialog.showModal();
  } else {
    dialog.setAttribute("open", "");
  }
}

function closeDialog(dialog) {
  if (typeof dialog.close === "function") {
    dialog.close();
  } else {
    dialog.removeAttribute("open");
  }
}

function handleStartClick() {
  if (state.rolling) {
    stopRoll();
    return;
  }

  startRoll();
}

function handleEndClick() {
  if (state.rolling) {
    window.clearInterval(state.rollTimer);
    state.rollTimer = 0;
    state.rolling = false;
    sound.stopRoll();
    updateView();
  }

  openDialog(elements.endDialog);
}

async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
      return;
    }

    await document.documentElement.requestFullscreen();

    if (screen.orientation?.lock) {
      screen.orientation.lock("landscape").catch(() => {});
    }
  } catch {
    window.alert("全画面にできませんでした。Chromeのメニューから「ホーム画面に追加」も試してください。");
  }
}

function updateFullscreenButton() {
  const isFullscreen = Boolean(document.fullscreenElement);
  elements.fullscreenButton.setAttribute("aria-label", isFullscreen ? "全画面を終了" : "全画面にする");
  elements.fullscreenButton.title = isFullscreen ? "全画面を終了" : "全画面";
}

function updateSpeechSide() {
  document.body.classList.toggle("speak-left", state.speechSide === "left");
  document.body.classList.toggle("speak-right", state.speechSide === "right");
}

function startSpeechLoop() {
  updateSpeechSide();
  state.speechTimer = window.setInterval(() => {
    state.speechSide = state.speechSide === "left" ? "right" : "left";
    updateSpeechSide();
  }, 1200);
}

function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.addEventListener("load", () => {
      const image = new Image();

      image.addEventListener("load", () => {
        const maxSize = 1280;
        const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
        const width = Math.round(image.width * scale);
        const height = Math.round(image.height * scale);
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        canvas.width = width;
        canvas.height = height;
        context.drawImage(image, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      });

      image.addEventListener("error", reject);
      image.src = reader.result;
    });

    reader.addEventListener("error", reject);
    reader.readAsDataURL(file);
  });
}

elements.startButton.addEventListener("click", handleStartClick);
elements.fullscreenButton.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", updateFullscreenButton);
elements.listButton.addEventListener("click", () => {
  renderList();
  openDialog(elements.listDialog);
});
elements.endButton.addEventListener("click", handleEndClick);
elements.closeListButton.addEventListener("click", () => closeDialog(elements.listDialog));
elements.cancelEndButton.addEventListener("click", () => closeDialog(elements.endDialog));
elements.cancelEndIconButton.addEventListener("click", () => closeDialog(elements.endDialog));
elements.confirmEndButton.addEventListener("click", () => {
  resetGame();
  closeDialog(elements.endDialog);
});

elements.photoSlots.forEach((slot) => {
  slot.addEventListener("click", () => {
    state.activePhotoSlot = Number(slot.dataset.photoSlot);
    elements.photoInput.click();
  });
});

elements.photoInput.addEventListener("change", async (event) => {
  const file = event.target.files?.[0];

  if (!file || state.activePhotoSlot === null) {
    return;
  }

  try {
    state.photos[state.activePhotoSlot] = await compressPhoto(file);
    savePhotos();
    renderPhotos();
  } finally {
    event.target.value = "";
    state.activePhotoSlot = null;
  }
});

elements.listDialog.addEventListener("click", (event) => {
  if (event.target === elements.listDialog) {
    closeDialog(elements.listDialog);
  }
});

elements.endDialog.addEventListener("click", (event) => {
  if (event.target === elements.endDialog) {
    closeDialog(elements.endDialog);
  }
});

loadState();
loadPhotos();
updateView();
renderPhotos();
updateFullscreenButton();
startSpeechLoop();

    </script>
  </body>
</html>
